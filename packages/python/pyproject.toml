[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "simmit"
version = "0.0.1"
description = "Simmit SDK — a cloud execution API for SimulationCraft. Not yet released; use the HTTP API directly."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
keywords = ["simmit", "simulationcraft", "simc", "wow", "warcraft"]

[project.urls]
Homepage = "https://github.com/void-platforms/simmit"
Repository = "https://github.com/void-platforms/simmit"
